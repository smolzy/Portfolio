<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10" />
      <stop offset="100%" stop-color="#14161d" />
    </linearGradient>

    <!-- Liquid Chrome Metallic Gradient -->
    <linearGradient id="liquidChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#cfd4e2" />
      <stop offset="45%" stop-color="#5a6072" />
      <stop offset="50%" stop-color="#1a1c23" />
      <stop offset="55%" stop-color="#d0d5e5" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7a8094" />
    </linearGradient>

    <linearGradient id="chromeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8088a0" stop-opacity="0.7" />
    </linearGradient>

    <filter id="chromeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Background Container -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="url(#bgGrad)" stroke="#3a3d4a" stroke-width="1.5" />

  <!-- Y2K 3D Hollow Chrome Slanted 5-Point Star -->
  <g filter="url(#chromeGlow)">
    <!-- Main Hollow Chrome Star Body (evenodd fill rule creates the hollow center) -->
    <path
      fill="url(#liquidChrome)"
      fill-rule="evenodd"
      stroke="url(#chromeHighlight)"
      stroke-width="1.2"
      stroke-linejoin="round"
      d="
        M 67 11 
        L 58 35 
        L 94 31 
        L 54 44 
        L 51 76 
        L 43 56 
        L 6 79 
        L 31 54 
        L 21 38 
        L 49 36 Z
        
        M 62 20
        L 49 38
        L 28 40
        L 35 52
        L 17 69
        L 43 52
        L 48 66
        L 50 43
        L 79 33
        L 55 35 Z
      "
    />

    <!-- 3D Bevel Edge Reflection Lines -->
    <path
      fill="none"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.85"
      d="
        M 67 11 L 43 56
        M 94 31 L 54 44
        M 51 76 L 43 56
        M 6 79 L 31 54
        M 21 38 L 49 36
      "
    />
  </g>
</svg>
